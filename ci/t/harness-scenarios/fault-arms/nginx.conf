@LOAD@
# Local scenario (NOT vendored, NOT gitignored): unlike testkit's
# consumer-zstd, this repo IS the module under test, so PROBER_MODULE is
# ngx_http_zstd_filter_module.so itself -- @LOAD@ already load_modules it,
# there is no separate probe .so to add. No requires-gate skip-forever
# hazard either. See plan-testkit-integration.md Phase 4.
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    # The CODEC-error oracle below reads these after nginx enters log phase.
    # A completed frame has all three values; an aborted one must expose none.
    log_format zstd_fault_vars "$uri $zstd_ratio $zstd_bytes_in $zstd_bytes_out";
    access_log @PREFIX@/logs/zstd-vars.log zstd_fault_vars;

    server {
        listen 127.0.0.1:@PORT@;

        root @PREFIX@/www;

        location / {
            zstd on;
            zstd_min_length 0;
        }

        # Dedicated dcz arm for the ZSTD_CCtx_refPrefix() fault site. The
        # prober speaks cleartext, so explicitly acknowledge that test-only
        # transport; the driver still has to negotiate dcz with the fixture's
        # exact SHA-256 and asserts Content-Encoding before trusting the arm.
        location /dcz/ {
            alias @PREFIX@/www/;
            zstd on;
            zstd_min_length 0;
            zstd_dcz_dict_file @BUILD_OBJS@/fault-arms.dict;
            zstd_dcz_assume_secure_transport on;
        }

        location /__probe { @PROBE@ }
    }
}
