@LOAD@
# Local scenario (NOT vendored, NOT gitignored). Same shape as fault-arms:
# this repo IS the module under test, so PROBER_MODULE is
# ngx_http_zstd_filter_module.so itself and @LOAD@ already load_modules it.
# There is no separate probe .so and no @PROBE_ZONE@ -- this module registers
# ZONELESS hooks (ngx_test_probe_register_module), so the probe document's
# pool/fd counters reach the driver through the module_render path that is
# emitted BEFORE the zone early-return (ngx_test_probe.c:551).
#
# Why this exists next to testkit's own consumer-zstd scenario: that one is
# generated into the testkit tree, load_modules a SEPARATE consumer .so out of
# a gitignored consumers/ dir, and therefore SKIPs on every remote leg there --
# permanently, by its own requires-gate comment ("Nothing in CI will tell you a
# consumer regressed"). Here the .so is the repo's own build product, so the
# identical oracle actually RUNS instead of skipping.
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    server {
        listen 127.0.0.1:@PORT@;

        # A REAL STATIC ROOT, not `return 200`. A return directive fires at the
        # REWRITE phase and short-circuits later phases, so the body filter
        # chain this module lives in would never run on a synthetic response
        # and the scenario would measure nothing. The driver writes
        # @PREFIX@/www/index.html before booting.
        root @PREFIX@/www;

        location / {
            zstd on;
            zstd_min_length 0;
        }

        location /__probe { @PROBE@ }
    }
}
