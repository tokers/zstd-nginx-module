        - has:
            stopBy: neighbor
            kind: identifier
            regex: ^(string_view|wstring_view)$
        - has:
            stopBy: end
            kind: binary_expression
            all:
              - has:
                  stopBy: end
                  kind: string_literal
                  nthChild: 1
              - has:
                  stopBy: end
                  kind: identifier
                  regex: ^(string|wstring)$

  u_5_var_instance_expr:
    # $VAR_instance = "..." + $EXPR
    kind: expression_statement
    all:
      - has:
          stopBy: neighbor
          kind: assignment_expression
          all:
            - has:
                stopBy: neighbor
