                      kind: string_literal
                  - has:
                      stopBy: neighbor
                      kind: identifier
                      pattern: $EXPR_INSTANCE
      - any:
          - inside:
              stopBy: end
              follows:
                stopBy: end
                kind: declaration
                all:
                  - has:
                      stopBy: neighbor
                      regex: ^(wstring|string|std::wstring|std::string|std::basic_string<.*>|basic_string<.*>)$
