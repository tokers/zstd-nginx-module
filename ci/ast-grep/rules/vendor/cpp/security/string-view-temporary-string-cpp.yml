    has:
      stopBy: neighbor
      kind: assignment_expression
      all:
        - has:
            stopBy: neighbor
            kind: identifier
            regex: ^(string_view|wstring_view)$
        - has:
            stopBy: neighbor
            kind: binary_expression
            has:
              stopBy: neighbor
              kind: identifier
              regex: ^(wstring|string)$
              nthChild: 1

  u_4_var_expr:
