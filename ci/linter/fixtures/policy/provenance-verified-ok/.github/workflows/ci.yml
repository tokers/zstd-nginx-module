---
name: ci
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo build
      - run: |
          wget -q -O tool.tgz "https://example.invalid/tool.tgz"
      - run: |
          actual="$(sha256sum tool.tgz | awk '{print $1}')"
          [ "$actual" = "deadbeef" ] || exit 1
      - run: |
          tar -xzf tool.tgz
          ./tool/configure
